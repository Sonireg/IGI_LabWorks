{% extends 'base_generic.html' %}
{% block content %}
  <h1>Типы услуг</h1>
  <a href="{% url 'servicetype_add' %}">Добавить тип услугии</a>
  <ul>
    {% for obj in object_list %}
      <li>
        {{ obj.name }} — {{ obj.description }}
        [<a href="{% url 'servicetype_edit' obj.pk %}">✎</a>]
        [<a href="{% url 'servicetype_delete' obj.pk %}">🗑</a>]
      </li>
    {% empty %}
      <li>Пока нет типов услуг.</li>
    {% endfor %}
  </ul>
{% endblock %}
