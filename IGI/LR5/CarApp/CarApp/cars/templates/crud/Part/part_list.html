{% extends 'base_generic.html' %}
{% block content %}
  <h1>Детали</h1>
  <a href="{% url 'part_add' %}">Добавить деталь</a>
  <ul>
    {% for obj in object_list %}
      <li>
        {{ obj.name }} — {{ obj.description }}
        [<a href="{% url 'part_edit' obj.pk %}">✎</a>]
        [<a href="{% url 'part_delete' obj.pk %}">🗑</a>]
      </li>
    {% empty %}
      <li>Пока нет деталей.</li>
    {% endfor %}
  </ul>
{% endblock %}
